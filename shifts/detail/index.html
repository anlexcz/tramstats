<!doctype html><html lang="cs"><head><meta charset="utf-8"><base href="/tramstats/"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202226"><title>Detail směny — TramStats</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css?v=20261102-css"><link rel="stylesheet" href="assets/components.css?v=20261102-css"></head><body class="page-detail"><header><a class="brand" href="./">TRAMSTATS</a><nav id="desktop-nav" aria-label="Hlavní navigace"></nav><span class="sandbox">OSOBNÍ EVIDENCE <b> / SANDBOX</b></span></header><main class="detail-page"><a class="detail-back" href="shifts/">← ZPĚT NA SMĚNY</a><div id="detail-view"><div id="status">Načítám směnu…</div></div></main><nav id="mobile-nav" aria-label="Mobilní navigace"></nav><script src="assets/data.js?v=20261101-1"></script><script src="assets/app.js?v=20261101-1"></script><script>document.addEventListener('DOMContentLoaded',async()=>{state.view='shifts';nav();const root=document.querySelector('#detail-view'),d=new URLSearchParams(location.search).get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')){root.innerHTML='<div class="empty">Neplatné datum směny.</div>';return;}try{const db=await TramStatsData.load();state.db=db;state.shifts=db.shifts;state.breaks=db.breaks;state.dataMinDate=db.minDate;state.dataMaxDate=db.maxDate;const s=db.shifts.find(x=>x.date===d);if(!s){root.innerHTML='<div class="empty">Směna nebyla nalezena.</div>';return;}document.title=`${date(d)} — TramStats`;root.innerHTML=`<div class="detail-head"><h1>${date(d)}</h1><p>${esc(s.day)} · směna ${esc(s.actualShift)} · ${esc(s.depot)}</p></div><div class="parts">${detailHTML(s)}</div>`;}catch(e){root.innerHTML=`<div class="empty">Databáze TramStats není dostupná. ${esc(e.message||e)}</div>`;}});</script></body></html>
