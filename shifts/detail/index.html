<!doctype html><html lang="cs"><head><meta charset="utf-8"><base href="/tramstats/"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202226"><title>Detail směny — TramStats</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css?v=20261029-6"><style>.detail-page{max-width:980px}.detail-back{display:inline-flex;color:#aeb3bc;text-decoration:none;font-size:13px;font-weight:700;margin:0 0 18px}.detail-back:hover{color:#fff}.detail-head{border-left:4px solid var(--red);padding:8px 0 8px 16px;margin-bottom:18px}.detail-head h1{margin:0;font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.03em}.detail-head p{margin:4px 0 0;color:#aeb3bc;font-weight:600}.detail-page .parts{display:flex;flex-direction:column;gap:8px}.detail-page .part,.detail-page .bp{background:#24262b;border:1px solid #34373d;padding:14px}.detail-page h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;margin:24px 0 10px}@media(max-width:650px){.detail-head h1{font-size:36px}.detail-page .part{overflow-x:auto}}</style></head><body><header><a class="brand" href="./">TRAMSTATS</a><nav id="desktop-nav" aria-label="Hlavní navigace"></nav><span class="sandbox">OSOBNÍ EVIDENCE <b> / SANDBOX</b></span></header><main class="detail-page"><a class="detail-back" href="shifts/">← ZPĚT NA SMĚNY</a><div id="detail-view"><div id="status">Načítám směnu…</div></div></main><nav id="mobile-nav" aria-label="Mobilní navigace"></nav><script src="assets/app.js?v=20261029-5"></script><script>document.addEventListener('DOMContentLoaded',async()=>{state.view='shifts';nav();const root=document.querySelector('#detail-view'),d=new URLSearchParams(location.search).get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')){root.innerHTML='<div class="empty">Neplatné datum směny.</div>';return;}try{const y=d.slice(0,4),[sr,br]=await Promise.all([fetch(`data/shifts-${y}.json`).then(r=>r.json()),fetch(`data/breaks-${y}.json`).then(r=>r.ok?r.json():[])]);state.breaks=br;const s=sr.find(x=>x.date===d);if(!s){root.innerHTML='<div class="empty">Směna nebyla nalezena.</div>';return;}document.title=`${date(d)} — TramStats`;root.innerHTML=`<div class="detail-head"><h1>${date(d)}</h1><p>${esc(s.day)} · SS ${esc(s.actualShift)} · ${esc(s.depot)}</p></div><div class="parts">${detailHTML(s)}</div>`;}catch(e){root.innerHTML='<div class="empty">Detail směny se nepodařilo načíst.</div>';}});</script></body></html>
