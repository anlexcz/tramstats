<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TramStats — design sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">TRAMSTATS</a>
  <nav><button class="nav active" data-view="dashboard">Přehled</button><button class="nav" data-view="shifts">Směny</button><button class="nav" data-view="stats">Statistiky</button><button class="nav" data-view="vehicles">Vozy</button></nav>
  <div class="top-actions"><span class="data-pill"><i data-lucide="database"></i> JSON sandbox</span><button class="icon-btn"><i data-lucide="settings"></i></button></div>
</header>
<main id="app"></main>
<nav class="mobile-nav"><button data-view="dashboard"><i data-lucide="layout-dashboard"></i></button><button data-view="shifts"><i data-lucide="calendar-days"></i></button><button class="quick"><i data-lucide="plus"></i></button><button data-view="stats"><i data-lucide="chart-no-axes-combined"></i></button><button data-view="vehicles"><i data-lucide="tram-front"></i></button></nav>
<script src="assets/app.js"></script>
</body></html>
